name: to2610-gpu
version: 0.1.0
spec: '0.1'
kind: ip
lang: verilog
identity:
  slug: to2610-gpu
  display_name: tiny-gpu compute chip
  summary: 'A small parallel-compute chip for the ECOS 2610 shuttle: tiny-gpu with four cores of four threads and its program and data memories on chip, loaded and started by a host over SPI.'
  category: soc
  subcategories:
  - gpu
  ip_family: tiny-gpu
  integration_profile: []
  maturity: simulated
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
deps:
  tiny-gpu: ^0.1
emit:
- kind: foreign
  lang: verilog
  top: tgpu_soc
  # 源码树是拼出来的：tiny-gpu 过 sv2v，加本仓的管理口与两块存储
  setup: src
  rtl:
  - build/src/gpu.v
  - hwsrc/spi_regs.v
  - hwsrc/tgpu_soc.v
  - hwsrc/vga.v
  clock:
    port: clk
  reset:
    port: rst_n
    active: low
    sync: false
  ports:
  - endpoint: mgmt
    kind: physical
    type: SpiSlavePins
    map:
      sck: sck
      csN: cs_n
      mosi: mosi
      miso: miso
      misoOe: miso_oe
  - endpoint: status
    kind: physical
    type: TgpuStatus
    map:
      done: done
      busy: busy
  - endpoint: video
    kind: physical
    type: VgaPins
    map:
      r: vga_r
      g: vga_g
      b: vga_b
      hs: vga_hs
      vs: vga_vs
      de: vga_de
      pclk: vga_pclk
  limits:
  - 四个核、每块四个线程是写死的；线程数要是 4 的整数倍，上游在最后一块装不满时不结束
  - 程序 256 条、数据 256 字节、寄存器与数据都是 8 位，是 tiny-gpu 指令集的上限
  - 上游的比较只分得出相等与不等，BRn 实际是「不等则跳」；除以 0 的结果不定
  - 没有处理器，内核与数据由片外主机经 SPI 装入
  - 视频只出并行 RGB332 与同步，HDMI 要片外一颗 TFP410；像素钟是主频的一半，主频换了画面跟着变
asic:
  top: to2610_gpu
  frame: mpc
  mhz: 50
  flow: syn_sta
  # 两块触发器存储各被四路读口选，默认的 0.4 下详细布线不收敛（违例降到一万二又涨回两万二）；放宽给走线腾地方
  util: 0.25
  # 管理口钉在与 to2610-switch、to2610-router 相同的位上，三颗共用一种管理排线
  pads:
  - { port: sck, at: 56 }
  - cs_n
  - mosi
  - { out: miso, oe: miso_oe }
  - done
  - busy
  # 视频放在 payload 的最低十二位：红三位、绿三位、蓝两位、行同步、场同步、DE、像素钟。
  # 板上同一组线一路经电阻网络进 VGA，一路进 TFP410 出 HDMI；直接出 TMDS 要 250 MHz 的位钟，Frame 里没有 PLL
  - { port: vga_r, at: 0 }
  - vga_g
  - vga_b
  - vga_hs
  - vga_vs
  - vga_de
  - vga_pclk
tasks:
  src:
    desc: 拼源码树：tiny-gpu 的源码过 sv2v
    run: bash htest/setup.sh {{dep.tiny-gpu}}
  gate:
    desc: 门级冒烟：布线后的网表配标准单元的功能模型，跑整片测试里的几项；网表与模型由流水线给（GATE_NETLIST、GATE_CELLS）
    run: bash htest/gate.sh {{out}}
    timeout: 10800
  chip:
    desc: 出流片的 .v，再在它上面跑整片测试
    run: bash htest/chip.sh {{out}}
  opencl:
    desc: 编带 tgpu 设备的 PoCL，经 OpenCL 在流片的 .v 上跑内建内核与 .tgk
    run: bash htest/opencl.sh {{out}}
  vulkan:
    desc: 同一组计算与渲染写成 GLSL 着色器，在 lavapipe 的计算管线与图形管线上跑，与流片的 .v 逐字节比
    run: bash htest/vulkan.sh {{out}}
  opengl:
    desc: 同一组三角形走 OpenGL 的图形管线（llvmpipe），帧缓冲与流片的 .v 逐像素比
    run: bash htest/opengl.sh {{out}}
test:
  upstream:
  - { name: chip, task: chip, timeout: 3600 }
  - { name: opencl, task: opencl, timeout: 3600 }
  - { name: vulkan, task: vulkan, timeout: 3600 }
  - { name: opengl, task: opengl, timeout: 3600 }
targets:
  foreign:
    driver: foreign
